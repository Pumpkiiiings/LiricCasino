# ═══════════════════════════════════════════════════════
#   CasinoLiric — Main Configuration
#   Supports: &a (Legacy), &#RRGGBB (Hex), <red> (MiniMessage)
# ═══════════════════════════════════════════════════════

# ─── Database ───────────────────────────────────────
database:
  type: "sqlite" # sqlite or mariadb
  host: "localhost"
  port: 3306
  database: "casino"
  username: "root"
  password: ""
  pool-size: 5

# ─── Tax System ────────────────────────────────
# Taxes apply to gross WINNINGS.
# Example: you win $10,000 with rate: 0.05 → you receive $9,500
taxes:
  enabled: false
  # Default rate if specific game rate is not configured
  default-rate: 0.05
  # Rates per game (comment or delete to use default-rate)
  roulette: 0.05
  slots: 0.05
  blackjack: 0.05
  scratch: 0.05
  lottery: 0.10
  coinflip: 0.05
  rps: 0.05
  ttt: 0.05
  racing: 0.05

# ─── Economy Boosters ────────────────────────────────
boosters:
  vip:
    booster: 2.0
    permiso: "vip.boost"
  mvp:
    booster: 3.0
    permiso: "mvp.boost"

# ─── Roulette ──────────────────────────────────────────────
roulette:
  min-players-to-start: 1
  countdown-seconds: 180
  max-bet: 200000.0
  number-payout: 36.0
  # Scale of the roulette blocks (0.1 - 2.0). Default: 0.45
  block-scale: 0.45
  # Radius in blocks of the roulette circle. Default: 5.5
  radius: 5.5
  color-multipliers:
    RED: 2.0
    BLACK: 2.0
    GREEN: 14.0

# ─── Discord Webhooks ─────────────────────────────────────
webhooks:
  enabled: false   # Change to true to enable

  # ── Jackpot (Slots 777 x100, etc.) ───────────────────────
  jackpot:
    url: "https://discord.com/api/webhooks/YOUR_ID/YOUR_TOKEN"
    # Embed color in decimal (0xFF00FF = magenta)
    color: 16711935
    title: "🎰 !!JACKPOT 777!!"
    description: "**{player}** hit the **777** on Slots and won **{amount}**! 🤑"
    footer: "Liric Casino • Slots"
    # Role mention (leave empty to not mention): "@everyone" or "<@&ROLE_ID>"
    mention-role: ""

  # ── Big Win (any game, exceeds min-amount) ────
  big-win:
    url: "https://discord.com/api/webhooks/YOUR_ID/YOUR_TOKEN"
    color: 16766720
    title: "💰 Big Win!"
    description: "**{player}** won **{amount}** playing **{game}**! 🎉"
    footer: "Liric Casino"
    mention-role: ""
    # Only triggers if winnings exceed this amount
    min-amount: 50000.0

  # ── Lottery Winner ────────────────────────────────────
  lottery:
    url: "https://discord.com/api/webhooks/YOUR_ID/YOUR_TOKEN"
    color: 16766720
    title: "🎟 Lottery Winner!"
    description: "**{player}** guessed the number **{number}** and won **{amount}**! 🎟✨"
    footer: "Liric Casino • Lottery"
    mention-role: ""


