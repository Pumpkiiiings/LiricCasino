# ─── Base de Datos ───────────────────────────────────────
database:
  type: "sqlite" # sqlite o mariadb
  host: "localhost"
  port: 3306
  database: "casino"
  username: "root"
  password: ""
  pool-size: 5

# ─── Boosters de economía ────────────────────────────────
boosters:
  vip:
    booster: 2.0
    permiso: "vip.boost"
  mvp:
    booster: 3.0
    permiso: "mvp.boost"

# ─── Ruleta Mixta ────────────────────────────────────────
