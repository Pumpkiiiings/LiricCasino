# CasinoLiric — Main Configuration
# Economy settings are in economy.yml. Prize tables are in prizes.yml.

database:
  type: "sqlite" # sqlite or mariadb
  host: "localhost"
  port: 3306
  database: "casino"
  username: "root"
  password: ""
  pool-size: 5

roulette:
  active: true
  min-players-to-start: 1
  countdown-seconds: 180
  block-scale: 0.45
  radius: 5.5

blackjack:
  active: true
  raise-amount: 5000.0

slots:
  active: true

scratch:
  active: true

lottery:
  active: true
  draw-interval-minutes: 60
  number-range: 1000

coinflip:
  active: true
  animation-ticks: 60

rps:
  active: true

ttt:
  active: true

racing:
  active: true
  countdown-seconds: 15
  duration-seconds: 8
  track-length: 24.0
  track-access-radius: 24.0

poker:
  active: true
  entry-fee: 5000.0
  raise-amount: 5000.0
  minimum-players: 2
  maximum-players: 6
  start-countdown-seconds: 30
  turn-seconds: 15
