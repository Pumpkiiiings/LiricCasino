  min-players-to-start: 1
  countdown-seconds: 180
  max-bet: 200000.0
  number-payout: 36.0
  color-multipliers:
    RED: 2.0
    BLACK: 2.0
    GREEN: 14.0

# ─── Blackjack ───────────────────────────────────────────
