# ═══════════════════════════════════════════════════════
#   CasinoLiric — Main Configuration
#   Supports: &a (Legacy), &#RRGGBB (Hex), <red> (MiniMessage)
# ═══════════════════════════════════════════════════════

# ─── Database ───────────────────────────────────────
database:
  type: "sqlite" # sqlite or mariadb
  host: "localhost"
  port: 3306
  database: "casino"
  username: "root"
  password: ""
  pool-size: 5

# ─── Tax System ────────────────────────────────
# Taxes apply to gross WINNINGS.
# Example: you win $10,000 with rate: 0.05 → you receive $9,500
taxes:
  enabled: false
  # Default rate if specific game rate is not configured
  default-rate: 0.05
  # Rates per game (comment or delete to use default-rate)
  roulette: 0.05
  slots: 0.05
  blackjack: 0.05
  scratch: 0.05
  lottery: 0.10
  coinflip: 0.05
  rps: 0.05
  ttt: 0.05
  racing: 0.05

# ─── Economy Boosters ────────────────────────────────
boosters:
  vip:
    booster: 2.0
    permiso: "vip.boost"
  mvp:
    booster: 3.0
    permiso: "mvp.boost"

# ─── Roulette ──────────────────────────────────────────────
roulette:
  active: true
  min-players-to-start: 1
  countdown-seconds: 180
  max-bet: 200000.0
  number-payout: 36.0
  # Limit uses per day based on rank
  uses:
    default:
      max-uses-per-day: 2
    ranks:
      vip:
        permission: "casinoliric.roulette.vip"
        max-uses-per-day: 10
      admin:
        permission: "casinoliric.roulette.admin"
        max-uses-per-day: -1 # -1 for unlimited
  # Scale of the roulette blocks (0.1 - 2.0). Default: 0.45
  block-scale: 0.45
  # Radius in blocks of the roulette circle. Default: 5.5
  radius: 5.5
  color-multipliers:
    RED: 2.0
    BLACK: 2.0
    GREEN: 14.0


# ─── Blackjack ───────────────────────────────────────────
blackjack:
  active: true
  bet:
    default:
      min: 100.0
      max: 100000.0
    ranks:
      vip:
        permission: "casinoliric.bet.vip"
        max: 500000.0
      admin:
        permission: "casinoliric.bet.admin"
        max: 10000000.0
  raise-amount: 5000.0
  uses:
    default:
      max-uses-per-day: 10
    ranks:
      vip:
        permission: "casinoliric.uses.vip"
        max-uses-per-day: 50
      admin:
        permission: "casinoliric.uses.admin"
        max-uses-per-day: -1

