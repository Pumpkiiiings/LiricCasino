    - "<white>%my_tickets%"

# Buy 1 Ticket Button
buy-1:
  slot: 29
  material: PAPER
  name: "<#00FF7F>✚ Buy 1 Ticket"
  lore:
    - "<gray>Add one ticket to your entry."
    - "<gray>Price: <#FFD700>$5,000"
    - ""
    - "<yellow>Click to buy!"

# Buy 5 Tickets Button
buy-5:
  slot: 33
  material: MAP
  name: "<#00FF7F>✚ Buy 5 Tickets"
  lore:
    - "<gray>Buy the maximum allowed per player."
    - "<gray>Price: <#FFD700>$25,000"
    - ""
    - "<yellow>Click to buy!"

# Format if player has no tickets
no-tickets-format: "<gray>You currently have no tickets."

