# Lottery Menu
title: "<dark_gray><bold>Lottery</bold></dark_gray> <dark_gray>▸</dark_gray> <white>Casino"
rows: 5

# Lottery Info
info:
  slot: 13
  material: GOLD_INGOT
  name: "<#FFD700><bold>🎟 CASINO LOTTERY</bold>"
  lore:
    - "<dark_gray>Draw Information"
    - ""
    - "<#00FF7F>💰 <gray>Current Jackpot: <#FFD700>%jackpot%"
    - "<#FFB400>🎫 <gray>Total Tickets: <white>%tickets%"
