title: "<#FF0000><bold>♠ TEXAS HOLD'EM ♠</bold></#FF0000>"

items:
  filler:
    material: GREEN_STAINED_GLASS_PANE
    name: " "
  player-head:
    material: PLAYER_HEAD
    name: "<#E0E0E0><bold>{name}</bold></#E0E0E0>"
  empty-card:
    material: MAP
    name: "<gray>COMMUNITY CARD</gray>"
  pot:
    material: GOLD_BLOCK
    name: "<#FFD700><bold>TOTAL POT: {pot}</bold></#FFD700>"
  time:
    material: CLOCK
    name: "<#FFB400>Time: {time}s</#FFB400>"
  fold:
    material: RED_DYE
    name: "<#FF5555><bold>FOLD</bold>"
  call:
    material: YELLOW_DYE
    name: "<#FFD700><bold>{text}</bold>"
  raise:
    material: LIME_DYE
    name: "<#00FF7F><bold>RAISE +${amount}</bold>"
    lore:
      - "<gray>Increase the current bet by ${amount}."
  wait:
    material: BARRIER
    name: "<#555555>Wait for your turn...</#555555>"
  hidden-card:
    material: PAPER
    name: "<#FFB400><bold>🂠 HIDDEN CARD</bold>"
