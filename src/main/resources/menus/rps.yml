# Rock Paper Scissors Choice Menu
title: "<#FF5555>⚔ <gold><bold>Rock Paper Scissors</bold> <#FF5555>⚔"
rows: 3

# ── Info Item ──
info-item:
  slot: 4
  material: PAPER
  name: "<#FFD700><bold>Your Bet: <white>$%amount%"
  lore:
    - "<gray>Opponent: <white>%opponent%"
    - " "
    - "<gray>Choose your play..."

# ── Buttons ──
piedra-btn:
  slot: 11
  material: COBBLESTONE
  name: "<gray><bold>🪨 ROCK</bold>"
  lore:
    - "<dark_gray>Beats Scissors"

papel-btn:
  slot: 13
  material: PAPER
  name: "<white><bold>📄 PAPER</bold>"
  lore:
    - "<dark_gray>Beats Rock"

tijera-btn:
  slot: 15
  material: SHEARS
  name: "<#FF5555><bold>✂ SCISSORS</bold>"
  lore:
    - "<dark_gray>Beats Paper"

cancel-btn:
  slot: 22
  material: BARRIER
  name: "<red><bold>✖ Cancel</bold>"
  lore: []

