# ─── Lotería ─────────────────────────────────────────────
lottery:
  bought: "{prefix} <#00FF7F>Compraste <#FFD700>{amount} boleto(s)</#FFD700> por <#FFD700>${cost}</#FFD700>. Números: <white>{numbers}</white>. Pozo: <#00FF7F>${jackpot}"
  no-funds: "{prefix} <#FF5555>No tienes <#FFD700>${cost}</#FFD700> para comprar el boleto."
  max-tickets: "{prefix} <#FF5555>Ya tienes el máximo de {max} boletos permitidos."
  received: "{prefix} <#00FF7F>¡Recibiste <#FFD700>{amount} boleto(s)</#FFD700> de lotería!"
  give-sender: "{prefix} <#00FF7F>Diste <#FFD700>{amount} boleto(s)</#FFD700> a <white>{player}</white>."
  usage: "{prefix} <#FF5555>Uso: /loteria <info|comprar [cantidad]|forcestart|give <jugador> [cantidad]>"
  # Anuncios de tiempo
  announce-1h: "{prefix} <#FFD700>🎟 ¡La Lotería sorteará en <white>1 hora</#FFD700>! Pozo: <#00FF7F>${jackpot}</#00FF7F>. Compra con /loteria comprar."
  announce-30m: "{prefix} <#FFD700>🎟 ¡La Lotería sorteará en <white>30 minutos</#FFD700>! Pozo: <#00FF7F>${jackpot}</#00FF7F>."
  announce-10m: "{prefix} <#FFD700>🎟 ¡La Lotería sorteará en <white>10 minutos</#FFD700>! Pozo: <#00FF7F>${jackpot}</#00FF7F>. Boletos: {tickets}."
  announce-1m: "{prefix} <#FF5555><bold>🎟 ¡ÚLTIMO MINUTO! La Lotería sortea en 1 minuto. Pozo: ${jackpot}.</bold></#FF5555>"
  announce-30s: "{prefix} <#FF5555>🎟 ¡La Lotería sortea en 30 segundos!"
  announce-10s: "{prefix} <#FF5555><bold>🎟 ¡10 SEGUNDOS PARA EL SORTEO DE LOTERÍA!</bold></#FF5555>"
  # Resultado
  no-winner: "{prefix} <#FFD700>🎟 El número ganador fue <white>{number}</#FFD700>. ¡Nadie acertó! El pozo de <#00FF7F>${jackpot}</#00FF7F> se acumula para el siguiente sorteo."
  winner-self: "{prefix} <#FFD700><bold>🎟 ¡GANASTE LA LOTERÍA!</bold></#FFD700> El número fue <white>{number}</white>. Recibes <#00FF7F>${amount}{tax}</#00FF7F>. ¡Felicidades!"
  winner-broadcast: "{prefix} <gradient:#FFD700:#FF6B6B><bold>🎟 ¡SORTEO DE LOTERÍA!</bold></gradient> El número fue <white>{number}</white>. <#FFD700>{winners}</#FFD700> gan(ó/aron) <#00FF7F>${amount}</#00FF7F>!"

# ─── CoinFlip ────────────────────────────────────────────
coinflip:
  created: "{prefix} <#FFD700>🪙 ¡Creaste un CoinFlip por <white>${amount}</white>! ID: <gray>{id}. <#00FF7F>Esperando oponente..."
  already-in-game: "{prefix} <#FF5555>Ya estás en un juego de CoinFlip. Usa /coinflip cancelar primero."
  invalid-amount: "{prefix} <#FF5555>La apuesta debe ser entre <white>${min}</white> y <white>${max}</white>."
  invalid-number: "{prefix} <#FF5555>Ingresa un número válido."
  no-funds: "{prefix} <#FF5555>No tienes suficiente dinero para esta apuesta."
  game-not-found: "{prefix} <#FF5555>No se encontró ningún juego abierto de <white>{player}</white>."
  no-game: "{prefix} <#FF5555>No tienes un juego abierto."
  cannot-cancel: "{prefix} <#FF5555>No puedes cancelar un juego que ya está en curso."
  cancelled: "{prefix} <#FFB400>🪙 Juego cancelado. Se te devolvieron <#FFD700>${amount}</#FFD700>."
  usage: "{prefix} <#FF5555>Uso: /coinflip <crear <monto>|unirse <jugador>|cancelar|lista>"
  # Broadcast de nuevo juego
  new-game-broadcast: "{prefix} <#FFD700>🪙 <white>{player}</#FFD700> creó un CoinFlip de <#00FF7F>${amount}</#00FF7F>. Únete con <#FFB400>/coinflip unirse {player}</#FFB400>."
  # Resultado
  win: "{prefix} <#00FF7F><bold>🪙 ¡GANASTE el CoinFlip!</bold> Te llevas <#FFD700>${amount}</#FFD700>{tax}."
  lose: "{prefix} <#FF5555>🪙 Perdiste el CoinFlip. Perdiste <#FFD700>${amount}</#FFD700>."
  broadcast-result: "{prefix} <gradient:#FFD700:#00FF7F>🪙 CoinFlip</gradient>: <white>{winner}</white> <#00FF7F>ganó <#FFD700>${amount}</#FFD700> contra <white>{loser}</white>!"

