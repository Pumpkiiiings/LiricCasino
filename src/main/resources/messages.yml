  countdown-30s: "{prefix} <#E0E0E0>¡La Ruleta girará en <#FF5555>30 segundos</#FF5555>! ¡Hagan sus apuestas!"
  countdown-10s: "{prefix} <#FF5555><bold>¡ATENCIÓN! La Ruleta gira en 10 segundos.</bold></#FF5555>"
  spinning: "{prefix} <#FFB400><bold>¡No va más! La Ruleta está girando...</bold></#FFB400>"
  result: "{prefix} <#E0E0E0>¡Ha caído el número <#FFB400><bold>{number}</bold></#FFB400> ({color}<#E0E0E0>) en la Ruleta!"
  win: "{prefix} <#00FF7F><bold>¡GANASTE!</bold> <#E0E0E0>Te llevas <#FFB400>${amount}</#FFB400>.{booster}"
  win-booster: " <aqua>(Booster: {booster}x)</aqua>"
  lose: "{prefix} <#FF5555>Perdiste tu apuesta de <#FFB400>${amount}</#FFB400>."
  deleted: "{prefix} <#00FF7F>¡Ruleta eliminada y borrada del archivo data.yml!"
  not-found: "{prefix} <#FF5555>No hay ninguna ruleta cerca."
  purged: "{prefix} <#00FF7F>¡PURGA NUCLEAR! Se eliminaron {count} entidades y se limpió el data.yml en este mundo."
  created: "{prefix} <#00FF7F>¡Ruleta creada con éxito!"
  escala-usage: "{prefix} <#FF5555>Uso: /casino ruleta escala <escala 0.1-2.0> [radio 2-15]"
  escala-set: "{prefix} <#00FF7F>Escala actualizada a <#FFB400>{scale}</#FFB400> con radio <#FFB400>{radius}</#FFB400>. Ruletas recreadas."

# ─── Blackjack ───────────────────────────────────────────
