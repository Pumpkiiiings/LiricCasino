  bet-placed: "{prefix} <#00FF7F>¡Apostaste <#FFB400>${amount}</#FFB400> {target}!"
  no-funds: "{prefix} <#FF5555>No tienes suficiente dinero."
  spin-announce: "{prefix} <#E0E0E0>¡Alguien acaba de apostar en la <#FF00FF><bold>Ruleta</bold></#FF00FF>! Girará en <#00FF7F>3 minutos</#00FF7F>. Usa <#FFB400>/ruleta</#FFB400> para unirte."
  countdown-2min: "{prefix} <#E0E0E0>¡La Ruleta girará en <#00FF7F>2 minutos</#00FF7F>! Hay {players} jugador(es) apostando."
