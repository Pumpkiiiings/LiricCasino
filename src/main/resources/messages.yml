  game-not-found: "{prefix} <#FF5555>No se encontró un duelo abierto de {player}."
  joined: "{prefix} <#FFD700>⚔ Te uniste al duelo de {player} por <#00FF7F>${amount}</#00FF7F>."
  opponent-joined: "{prefix} <#FFD700>⚔ <white>{player}</white> se unió a tu duelo."
  choice-locked: "{prefix} <#00FF7F>Fijaste tu elección: {choice}."
  tie: "{prefix} <#FFB400>⚔ ¡EMPATE! Ambos eligieron {c1}. Apuestas devueltas."
  win: "{prefix} <#00FF7F><bold>⚔ ¡GANASTE!</bold> Tu {myChoice} venció a {opChoice}. Ganaste <#FFD700>${amount}</#FFD700>{tax}."
  lose: "{prefix} <#FF5555>⚔ Perdiste. Tu {myChoice} perdió contra {opChoice}. Perdiste <#FFD700>${amount}</#FFD700>."
  broadcast-result: "{prefix} <gradient:#FF5555:#FFD700>⚔ RPS</gradient>: <white>{winner}</white> ({wChoice}) <#00FF7F>venció a <white>{loser}</white> ({lChoice}) y ganó <#FFD700>${amount}</#FFD700>!"
  no-game: "{prefix} <#FF5555>No tienes un duelo abierto."
  cannot-cancel: "{prefix} <#FF5555>El juego ya empezó."
  cancelled: "{prefix} <#FFB400>⚔ Duelo cancelado. Se devolvió tu apuesta de <#FFD700>${amount}</#FFD700>."
  usage: "{prefix} <#FF5555>Uso: /rps <crear <monto>|unirse <jugador>|cancelar>"

