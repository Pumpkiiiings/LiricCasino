name: CasinoLiric
version: 2.0.3
main: liric.casino.CasinoPlugin
api-version: '1.20'
author: Liric Casino Team
depend: [Vault]
softdepend: [PlaceholderAPI]

commands:
  casino:
    description: >
      Main command of the Casino.
      Subcategories: ruleta, blackjack, tragamonedas, poker, boleto, loteria, coinflip, rps, ttt, carreras, stats, top, reload
    usage: |
      /casino <game> [action]
      /casino stats [game]
      /casino top [game]
      /casino reload
    aliases: [c]

  # ── Alias de acceso rápido por juego (apuntan al mismo handler) ───────────
  ruleta:
    description: Open or manage the Casino roulette.
    usage: /ruleta [jugar|setup|delete|forcestart|purge]
    aliases: [roulette]

  blackjack:
    description: Play 21 Blackjack.
    usage: /blackjack [jugar|setup|delete]
    aliases: [bj, 21]

  poker:
    description: Join the Poker table.
    usage: /poker [jugar|setup|delete]

  tragamonedas:
    description: Open the 777 slot machine.
    usage: /tragamonedas [setup|delete|purge]
    aliases: [slots, 777]

  boleto:
    description: Buy Scratch and Win tickets.
    usage: /boleto <comprar|get|give> [tier] [cantidad]
    aliases: [scratch]

  loteria:
    description: Buy lottery tickets and wait for the draw.
    usage: /loteria [info|comprar [cantidad]|forcestart|give <jugador> [cantidad]]
    aliases: [lottery]

  coinflip:
    description: CoinFlip PvP — create or join a bet.
    usage: /coinflip [menu|crear <monto>|unirse <jugador>|cancelar]
    aliases: [moneda]

  cf:
    description: Short alias for CoinFlip.
    usage: /cf [menu|crear <monto>|unirse <jugador>|cancelar]

  rps:
    description: Rock Paper Scissors PvP.
    usage: /rps [crear <monto>|unirse <jugador>|cancelar|ayuda]

  ttt:
    description: Tic Tac Toe PvP.
    usage: /ttt [crear <monto>|unirse <jugador>|cancelar|ayuda]

  carreras:
    description: Horse racing betting.
    usage: /carreras [jugar|ayuda]

permissions:
  casino.admin:
    description: Allows administering the casino (setup, delete, forcestart, give, reload, etc.).
    default: op
