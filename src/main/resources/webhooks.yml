# ─── Discord Webhooks ─────────────────────────────────────
webhooks:
  enabled: false   # Change to true to enable

  # ── Jackpot (Slots 777 x100, etc.) ───────────────────────
  jackpot:
    url: "https://discord.com/api/webhooks/YOUR_ID/YOUR_TOKEN"
    # Embed color in decimal (0xFF00FF = magenta)
    color: 16711935
    title: "🎰 !!JACKPOT 777!!"
    description: "**{player}** hit the **777** on Slots and won **{amount}**! 🤑"
    footer: "Liric Casino • Slots"
    # Role mention (leave empty to not mention): "@everyone" or "<@&ROLE_ID>"
    mention-role: ""

  # ── Big Win (any game, exceeds min-amount) ────
  big-win:
    url: "https://discord.com/api/webhooks/YOUR_ID/YOUR_TOKEN"
    color: 16766720
    title: "💰 Big Win!"
    description: "**{player}** won **{amount}** playing **{game}**! 🎉"
    footer: "Liric Casino"
    mention-role: ""
    # Only triggers if winnings exceed this amount
    min-amount: 50000.0

  # ── Lottery Winner ────────────────────────────────────
  lottery:
    url: "https://discord.com/api/webhooks/YOUR_ID/YOUR_TOKEN"
    color: 16766720
    title: "🎟 Lottery Winner!"
    description: "**{player}** guessed the number **{number}** and won **{amount}**! 🎟✨"
    footer: "Liric Casino • Lottery"
    mention-role: ""
