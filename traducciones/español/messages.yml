  usage: "{prefix} <#FF5555>Usage: /slots <setup|delete|purge>"

# ─── Scratch and Win ────────────────────────────────────────
scratch:
  win: "{prefix} <#00FF7F><bold>CONGRATULATIONS!</bold> <#E0E0E0>You matched {count} {prize} <#E0E0E0>and won <#FFB400>${amount}</#FFB400>."
  win-trash: "{prefix} <#FF5555>You matched {count} {prize}. Bad luck, no prize!"
  no-prize: "{prefix} <#FF5555>Scratch card had no prize. Better luck next time!"
  bought: "{prefix} <#00FF7F>You bought <#FFB400>{amount} {tier} ticket(s)</#FFB400> for <#FFB400>${cost}</#FFB400>."
  no-funds: "{prefix} <#FF5555>You do not have <#FFB400>${cost}</#FFB400> for this."
  got-free: "{prefix} <#00FF7F>You received <#FFB400>{amount} free {tier} ticket(s)</#FFB400>."
  gave-sender: "{prefix} <#00FF7F>You gave <#FFB400>{amount} {tier} ticket(s)</#FFB400> to <#FFB400>{player}</#FFB400>."
  gave-target: "{prefix} <#00FF7F>You received <#FFB400>{amount} {tier} ticket(s)</#FFB400> as a gift!"
