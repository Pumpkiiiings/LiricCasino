  lose: "{prefix} <#FF5555>⬛ You lost. You lost <#FFD700>${amount}</#FFD700>."
  broadcast-result: "{prefix} <gradient:#00FFFF:#00FF7F>⬛ TicTacToe</gradient>: <white>{winner}</white> <#00FF7F>beat <white>{loser}</white> and won <#FFD700>${amount}</#FFD700>!"
