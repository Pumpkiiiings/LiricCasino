  countdown-1min: "{prefix} <#E0E0E0>Last minute! Roulette will spin in <#00FF7F>1 minute</#00FF7F>."
  countdown-30s: "{prefix} <#E0E0E0>Roulette will spin in <#FF5555>30 seconds</#FF5555>! Place your bets!"
  countdown-10s: "{prefix} <#FF5555><bold>ATTENTION! Roulette spins in 10 seconds.</bold></#FF5555>"
  spinning: "{prefix} <#FFB400><bold>No more bets! The roulette is spinning...</bold></#FFB400>"
  result: "{prefix} <#E0E0E0>Winning Number: <#FFB400><bold>{number}</bold></#FFB400> ({color}<#E0E0E0>)!"
  win: "{prefix} <#00FF7F><bold>YOU WON!</bold> <#E0E0E0>You got <#FFB400>${amount}</#FFB400>.{booster}"
  win-booster: " <aqua>(Booster: {booster}x)</aqua>"
  lose: "{prefix} <#FF5555>You lost your bet of <#FFB400>${amount}</#FFB400>."
  deleted: "{prefix} <#00FF7F>Roulette deleted and removed from data.yml!"
  not-found: "{prefix} <#FF5555>No roulette nearby."
  purged: "{prefix} <#00FF7F>NUCLEAR PURGE! Removed {count} entities and cleared data.yml in this world."
  created: "{prefix} <#00FF7F>Roulette created successfully!"
  escala-usage: "{prefix} <#FF5555>Usage: /casino roulette scale <scale 0.1-2.0> [radius 2-15]"
  escala-set: "{prefix} <#00FF7F>Scale updated to <#FFB400>{scale}</#FFB400> with radius <#FFB400>{radius}</#FFB400>. Roulettes recreated."

