  usage: "{prefix} <#FF5555>Usage: /poker <join|leave|setup|delete>"

# ─── Lottery ─────────────────────────────────────────────
lottery:
  bought: "{prefix} <#00FF7F>You bought <#FFD700>{amount} ticket(s)</#FFD700> for <#FFD700>${cost}</#FFD700>. Numbers: <white>{numbers}</white>. Jackpot: <#00FF7F>${jackpot}"
  no-funds: "{prefix} <#FF5555>You do not have <#FFD700>${cost}</#FFD700> to buy the ticket."
  max-tickets: "{prefix} <#FF5555>You already have the maximum of {max} tickets allowed."
  received: "{prefix} <#00FF7F>You received <#FFD700>{amount} lottery ticket(s)</#FFD700>!"
  give-sender: "{prefix} <#00FF7F>You gave <#FFD700>{amount} ticket(s)</#FFD700> to <white>{player}</white>."
  usage: "{prefix} <#FF5555>Usage: /lottery <info|buy [amount]|forcestart|give <player> [amount]>"
  # Time announcements
  announce-1h: "{prefix} <#FFD700>🎟 The Lottery draw will take place in <white>1 hour</#FFD700>! Jackpot: <#00FF7F>${jackpot}</#00FF7F>. Buy with /lottery buy."
  announce-30m: "{prefix} <#FFD700>🎟 The Lottery draw will take place in <white>30 minutes</#FFD700>! Jackpot: <#00FF7F>${jackpot}</#00FF7F>."
  announce-10m: "{prefix} <#FFD700>🎟 The Lottery draw will take place in <white>10 minutes</#FFD700>! Jackpot: <#00FF7F>${jackpot}</#00FF7F>. Tickets: {tickets}."
  announce-1m: "{prefix} <#FF5555><bold>🎟 LAST MINUTE! The Lottery draws in 1 minute. Jackpot: ${jackpot}.</bold></#FF5555>"
  announce-30s: "{prefix} <#FF5555>🎟 The Lottery draws in 30 seconds!"
  announce-10s: "{prefix} <#FF5555><bold>🎟 10 SECONDS UNTIL THE LOTTERY DRAW!</bold></#FF5555>"
  # Result
  no-winner: "{prefix} <#FFD700>🎟 The winning number was <white>{number}</#FFD700>. No winners! The jackpot of <#00FF7F>${jackpot}</#00FF7F> accumulates for the next draw."
  winner-self: "{prefix} <#FFD700><bold>🎟 YOU WON THE LOTTERY!</bold></#FFD700> The winning number was <white>{number}</white>. You receive <#00FF7F>${amount}{tax}</#00FF7F>. Congratulations!"
  winner-broadcast: "{prefix} <gradient:#FFD700:#FF6B6B><bold>🎟 LOTTERY DRAW!</bold></gradient> The winning number was <white>{number}</white>. <#FFD700>{winners}</#FFD700> won <#00FF7F>${amount}</#00FF7F>!"

# ─── CoinFlip ────────────────────────────────────────────
coinflip:
  created: "{prefix} <#FFD700>🪙 You created a CoinFlip for <white>${amount}</white>! ID: <gray>{id}. <#00FF7F>Waiting for opponent..."
  already-in-game: "{prefix} <#FF5555>You are already in a CoinFlip game. Use /coinflip cancel first."
  invalid-amount: "{prefix} <#FF5555>The bet must be between <white>${min}</white> and <white>${max}</white>."
  invalid-number: "{prefix} <#FF5555>Please enter a valid number."
  no-funds: "{prefix} <#FF5555>You do not have enough money for this bet."
  game-not-found: "{prefix} <#FF5555>No open game found from <white>{player}</white>."
  no-game: "{prefix} <#FF5555>You do not have an open game."
  cannot-cancel: "{prefix} <#FF5555>You cannot cancel a game that is already in progress."
  cancelled: "{prefix} <#FFB400>🪙 Game cancelled. Your <#FFD700>${amount}</#FFD700> has been returned."
  usage: "{prefix} <#FF5555>Usage: /coinflip <create <amount>|join <player>|cancel|list>"
  # New game broadcast
  new-game-broadcast: "{prefix} <#FFD700>🪙 <white>{player}</#FFD700> created a CoinFlip of <#00FF7F>${amount}</#00FF7F>. Join with <#FFB400>/coinflip join {player}</#FFB400>."
  # Result
  win: "{prefix} <#00FF7F><bold>🪙 YOU WON the CoinFlip!</bold> You get <#FFD700>${amount}</#FFD700>{tax}."
  lose: "{prefix} <#FF5555>🪙 You lost the CoinFlip. You lost <#FFD700>${amount}</#FFD700>."
  broadcast-result: "{prefix} <gradient:#FFD700:#00FF7F>🪙 CoinFlip</gradient>: <white>{winner}</white> <#00FF7F>won <#FFD700>${amount}</#FFD700> against <white>{loser}</white>!"

# ─── Piedra Papel Tijera ─────────────────────────────────
rps:
  already-in-game: "{prefix} <#FF5555>You are already in a game."
  invalid-amount: "{prefix} <#FF5555>The bet must be between <#FFD700>${min}</#FFD700> and <#FFD700>${max}</#FFD700>."
  no-funds: "{prefix} <#FF5555>You do not have enough funds."
  created: "{prefix} <#FFD700>⚔ RPS duel created for <#00FF7F>${amount}</#00FF7F>. Waiting for opponent..."
  broadcast-new: "{prefix} <#FF5555>⚔ <white>{player}</white> created a Rock Paper Scissors duel for <#FFD700>${amount}</#FFD700>. Join with <#FFB400>/rps join {player}</#FFB400>."
  game-not-found: "{prefix} <#FF5555>No open duel found from {player}."
  joined: "{prefix} <#FFD700>⚔ You joined {player}'s duel for <#00FF7F>${amount}</#00FF7F>."
  opponent-joined: "{prefix} <#FFD700>⚔ <white>{player}</white> joined your duel."
  choice-locked: "{prefix} <#00FF7F>Your choice is locked: {choice}."
  tie: "{prefix} <#FFB400>⚔ TIE! Both chose {c1}. Bets returned."
  win: "{prefix} <#00FF7F><bold>⚔ YOU WON!</bold> Your {myChoice} beat {opChoice}. You won <#FFD700>${amount}</#FFD700>{tax}."
  lose: "{prefix} <#FF5555>⚔ You lost. Your {myChoice} lost to {opChoice}. You lost <#FFD700>${amount}</#FFD700>."
  broadcast-result: "{prefix} <gradient:#FF5555:#FFD700>⚔ RPS</gradient>: <white>{winner}</white> ({wChoice}) <#00FF7F>beat <white>{loser}</white> ({lChoice}) and won <#FFD700>${amount}</#FFD700>!"
  no-game: "{prefix} <#FF5555>You do not have an open duel."
  cannot-cancel: "{prefix} <#FF5555>The game has already started."
  cancelled: "{prefix} <#FFB400>⚔ Duel cancelled. Your bet of <#FFD700>${amount}</#FFD700> has been returned."
  usage: "{prefix} <#FF5555>Usage: /rps <create <amount>|join <player>|cancel>"

