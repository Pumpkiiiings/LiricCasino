prefix: "<#FF0000><bold>CASINO</bold></#FF0000> <gray>»</gray>"

# ─── General ────────────────────────────────────────────
general:
  no-permission: "{prefix} <#FF5555>You do not have administrator permissions."
  only-players: "{prefix} <#FF5555>Only players can use this command."
  invalid-action: "{prefix} <#FF5555>Invalid action. Check command usage."
  no-funds: "{prefix} <#FF5555>You do not have enough money."
  game-disabled: "{prefix} <#FF5555>This game is currently <#FFB400><bold>disabled</bold></#FFB400><#FF5555>."
  command-separator: "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

# ─── Stats and Top ─────────────────────────────────────────
stats:
  usage: "{prefix} <#FF5555>Usage: /casino <stats|top|reload> [mode]"

