  cannot-climb: "<#FF5555><bold>You cannot climb onto the table!</bold></#FF5555>"
  already-bet: "{prefix} <#FF5555>You have already bet in this round. Only 1 bet is allowed."
  bet-range: "{prefix} <#FF5555>The bet must be between $1 and ${max}."
  bet-placed: "{prefix} <#00FF7F>You bet <#FFB400>${amount}</#FFB400> {target}!"
  no-funds: "{prefix} <#FF5555>You do not have enough money."
  spin-announce: "{prefix} <#E0E0E0>Someone just placed a bet in <#FF00FF><bold>Roulette</bold></#FF00FF>! It will spin in <#00FF7F>3 minutes</#00FF7F>. Use <#FFB400>/roulette</#FFB400> to join."
